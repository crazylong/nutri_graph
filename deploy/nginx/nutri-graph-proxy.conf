# /etc/nginx/nutri-graph-proxy.conf
# 反代公共参数，被各 location include 进来（避免十行重复）。
#
# 几个不能省的：
#   Host              —— FastAPI 生成 /docs 里的绝对地址要用
#   X-Real-IP / XFF   —— 短信频控、日志、限流都靠它拿真实来源
#   Connection ""     —— 配合 upstream keepalive，否则每个请求都新建连接
#   proxy_buffering off —— /chat 可能跑十几秒，关掉缓冲才能尽早把响应推给浏览器
#   read_timeout 120s —— 默认 60s 对"图检索 + 大模型"偏紧，一次冷启动容易刚好卡在边界

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_connect_timeout 5s;
proxy_buffering off;
