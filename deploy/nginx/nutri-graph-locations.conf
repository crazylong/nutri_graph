# /etc/nginx/default.d/nutri-graph-locations.conf
#
# 这个文件被 /etc/nginx/nginx.conf 里那个 listen 80 的 server 块通过
# `include /etc/nginx/default.d/*.conf;` 引入 —— 所以改这里就够了，
# 不用碰主配置，也不用和已有站点（3000 端口那个）抢 server。
#
# 分工：
#   /            静态页面（/var/www/nutri_graph）
#   /chat 等    反代到 127.0.0.1:8810
# 静态页与 API 同源，前端就不用处理跨域和 Cookie SameSite。

# ---------- 静态页面 ----------
# root 必须写在 location 里：server 块已经有 root 了，重复写会报
# "root directive is duplicate"。
location / {
    root /var/www/nutri_graph;
    try_files $uri $uri/ /index.html;
}

# index.html 不缓存：改了页面要立刻生效，不然排查问题时会被浏览器骗
location = /index.html {
    root /var/www/nutri_graph;
    add_header Cache-Control "no-store, must-revalidate";
}

# 静态资源可以放心缓存
location /assets/ {
    root /var/www/nutri_graph;
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}

# ---------- API 反代 ----------
location /chat {
    limit_req zone=nutri_chat burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://nutri_graph_api;
    include /etc/nginx/nutri-graph-proxy.conf;
}

# 历史会话。不写这两段时，location / 的 try_files 会把它们当成静态页，
# 回一份 index.html（200），前端解析 JSON 失败后侧栏就一直是空的。
location /sessions {
    limit_req zone=nutri_api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://nutri_graph_api;
    include /etc/nginx/nutri-graph-proxy.conf;
}

location = /recent-questions {
    limit_req zone=nutri_api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://nutri_graph_api;
    include /etc/nginx/nutri-graph-proxy.conf;
}

# 登录/令牌/短信用的是普通频控（它们自己有应用层限流）
location /auth/ {
    limit_req zone=nutri_api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://nutri_graph_api;
    include /etc/nginx/nutri-graph-proxy.conf;
}

location /kg/ {
    limit_req zone=nutri_api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://nutri_graph_api;
    include /etc/nginx/nutri-graph-proxy.conf;
}

# 管理接口：外网本来就不该直接可达。这里不额外放行，
# 依赖应用层的 require_admin；如要彻底关闭，把下面几行注释掉即可。
location /admin/ {
    limit_req zone=nutri_api burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://nutri_graph_api;
    include /etc/nginx/nutri-graph-proxy.conf;
}

location /llm/ {
    limit_req zone=nutri_api burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://nutri_graph_api;
    include /etc/nginx/nutri-graph-proxy.conf;
}

location = /health {
    proxy_pass http://nutri_graph_api;
    include /etc/nginx/nutri-graph-proxy.conf;
    access_log off;
}

# 接口文档（Swagger UI 的静态资源走 CDN，所以只要代理这两个路径）
location /docs {
    proxy_pass http://nutri_graph_api;
    include /etc/nginx/nutri-graph-proxy.conf;
}
location /redoc {
    proxy_pass http://nutri_graph_api;
    include /etc/nginx/nutri-graph-proxy.conf;
}
location = /openapi.json {
    proxy_pass http://nutri_graph_api;
    include /etc/nginx/nutri-graph-proxy.conf;
}
