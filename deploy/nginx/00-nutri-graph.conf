# /etc/nginx/conf.d/00-nutri-graph.conf
# 放在 http 上下文：只定义 upstream 和限流区，不定义 server。
#
# 为什么不新起一个 server 块：这台机的 80 端口已经有默认站点，
# 而访问用的是 IP、没有域名，再起一个 server_name _ 的块也不会被选中。
# 正确做法是用默认站点自带的扩展点 `include /etc/nginx/default.d/*.conf;`
# （见 nutri-graph-locations.conf），不去改动 nginx.conf。

upstream nutri_graph_api {
    server 127.0.0.1:8810;
    keepalive 16;
}

# /chat 是会真花钱的接口。应用层还有用户日配额，这里只挡同一 NAT 后的脚本。
# 单 IP 每分钟 60 次，和 nutri_api 同量级。再低的话，第二个人还没进配额就被 429。
limit_req_zone $binary_remote_addr zone=nutri_chat:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=nutri_api:10m rate=60r/m;
limit_req_status 429;
