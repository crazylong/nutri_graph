# /etc/nginx/conf.d/10-yangshengleme-ssl.conf
#
# 域名 HTTPS 站点。放在 conf.d（被 nginx.conf 的 http 块 include），
# 不放 default.d —— 那里只有 location，是给 80 默认站点用的扩展点。
#
# 为什么要单独起 server 块：
#   默认站点是 server_name _，域名请求会命中它，而它没有证书也没有 443。
#   这里显式接住 yangshengleme.fun / www 两个名字，把同一份 location 规则
#   include 进来，保证域名访问和 IP 访问行为一致、不会两处漂移。
#
# 现状背景（2026-11-03）：
#   80 端口被阿里云「未备案拦截」挡住（返回 403 Non-compliance ICP Filing），
#   443 不拦。所以证书是用 TLS-ALPN-01 签的，不依赖 80。
#   备案通过后，把 80 的拦截解除即可，本文件不用改。

# ---------- 80：跳 HTTPS + 留一个 ACME 续期入口 ----------
server {
    listen      80;
    listen      [::]:80;
    server_name yangshengleme.fun www.yangshengleme.fun;

    # 备案通过后 acme.sh 可改用 webroot 续期，走这里，无需停 nginx。
    # （现在 80 被拦截，这条暂时用不上，但先放着不影响。）
    location /.well-known/acme-challenge/ {
        root /var/www/nutri_graph;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：真正的服务入口 ----------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name yangshengleme.fun www.yangshengleme.fun;

    # 由 acme.sh --install-cert 写入，续期后自动覆盖并 reload
    ssl_certificate     /etc/nginx/ssl/yangshengleme.fun/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/yangshengleme.fun/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 不开 ssl_stapling：Let's Encrypt 已停用 OCSP（2025 起）

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    root /var/www/nutri_graph;

    # 与 80 默认站点共用同一份静态/反代规则
    include /etc/nginx/default.d/nutri-graph-locations.conf;
}
